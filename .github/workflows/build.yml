name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: Win32
            vcpkg_triplet: x86-windows-static
          - platform: x64
            vcpkg_triplet: x64-windows-static
          - platform: ARM64
            vcpkg_triplet: arm64-windows-static

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install dependencies via vcpkg
      run: vcpkg install --triplet ${{ matrix.vcpkg_triplet }} --x-install-root=vcpkg_installed
      env:
        VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}

    - name: Build
      run: msbuild LightDownloader.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LightDownloader-${{ matrix.platform }}
        path: bin/${{ matrix.platform }}/Release/LightDownloader.exe
